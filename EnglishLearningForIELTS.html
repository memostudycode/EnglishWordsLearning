    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 300;
            color: #ffffff;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 20px;
            background-color: #3d3d3d;
            color: #e0e0e0;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .mode-btn:hover {
            background-color: #4d4d4d;
        }

        .mode-btn.active {
            background-color: #5d5d5d;
            border-color: #6d6d6d;
        }

        .card-container {
            background-color: #3d3d3d;
            border-radius: 8px;
            padding: 40px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .card-container:hover {
            background-color: #4d4d4d;
        }

        .word-display {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .meaning-display {
            font-size: 20px;
            color: #b0b0b0;
            display: none;
        }

        .meaning-display.visible {
            display: block;
        }

        .input-container {
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background-color: #3d3d3d;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 16px;
        }

        .input-field:focus {
            outline: none;
            border-color: #5d5d5d;
        }

        .answer-feedback {
            margin-top: 10px;
            font-size: 16px;
        }

        .answer-feedback.correct {
            color: #4caf50;
        }

        .answer-feedback.incorrect {
            color: #f44336;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 24px;
            background-color: #3d3d3d;
            color: #e0e0e0;
            border: 1px solid #4d4d4d;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        .control-btn:hover {
            background-color: #4d4d4d;
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            color: #b0b0b0;
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid #4d4d4d;
        }

        .error-words-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #4d4d4d;
        }

        .error-words-title {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 10px;
        }

        .error-words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .error-word-tag {
            background-color: #5d3d3d;
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }
    </style>

<body>
    <div class="container">
        <h1>IELTS Word Trainer</h1>
        
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="flip-card">Flip Card</button>
            <button class="mode-btn" data-mode="quiz">Quiz</button>
            <button class="mode-btn" data-mode="fill-blank">Fill Blank</button>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="word-display" id="wordDisplay">Loading...</div>
            <div class="meaning-display" id="meaningDisplay"></div>
        </div>

        <div class="input-container hidden" id="inputContainer">
            <input type="text" class="input-field" id="inputField" placeholder="Type the English word..." autocomplete="off">
            <div class="answer-feedback" id="answerFeedback"></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="knowBtn">Know</button>
            <button class="control-btn" id="unknownBtn">Unknown</button>
            <button class="control-btn" id="nextBtn">Next</button>
            <button class="control-btn" id="shuffleBtn">Shuffle</button>
        </div>

        <div class="status-bar">
            <span id="progressCounter">Progress: 0/0</span>
            <span id="errorCounter">Error words: 0</span>
        </div>

        <div class="error-words-section hidden" id="errorWordsSection">
            <div class="error-words-title">Error Words:</div>
            <div class="error-words-list" id="errorWordsList"></div>
        </div>
    </div>

        let currentIndex = 0;
        let errorWords = [];
        let currentMode = 'flip-card';
        let wordList = [...ieltsVocabulary];

        function fisherYatesShuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function saveToLocalStorage() {
            try {
                const data = {
                    currentIndex,
                    errorWords
                };
                localStorage.setItem('ieltsTrainerData', JSON.stringify(data));
            } catch (e) {
            }
        }

        function loadFromLocalStorage() {
            try {
                const data = localStorage.getItem('ieltsTrainerData');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed.currentIndex !== undefined) {
                        currentIndex = parsed.currentIndex;
                    }
                    if (parsed.errorWords) {
                        errorWords = parsed.errorWords;
                    }
                }
            } catch (e) {
                currentIndex = 0;
                errorWords = [];
            }
        }

        function updateUI() {
            const word = wordList[currentIndex];
            const wordDisplay = document.getElementById('wordDisplay');
            const meaningDisplay = document.getElementById('meaningDisplay');
            const inputContainer = document.getElementById('inputContainer');
            const inputField = document.getElementById('inputField');
            const answerFeedback = document.getElementById('answerFeedback');
            const progressCounter = document.getElementById('progressCounter');
            const errorCounter = document.getElementById('errorCounter');
            const errorWordsSection = document.getElementById('errorWordsSection');
            const errorWordsList = document.getElementById('errorWordsList');

            if (currentMode === 'flip-card') {
                wordDisplay.textContent = word.english;
                meaningDisplay.textContent = word.chinese;
                meaningDisplay.classList.remove('visible');
                inputContainer.classList.add('hidden');
            } else if (currentMode === 'quiz') {
                wordDisplay.textContent = word.chinese;
                meaningDisplay.textContent = word.english;
                meaningDisplay.classList.remove('visible');
                inputContainer.classList.add('hidden');
            } else if (currentMode === 'fill-blank') {
                wordDisplay.textContent = word.chinese;
                meaningDisplay.textContent = '';
                inputContainer.classList.remove('hidden');
                inputField.value = '';
                answerFeedback.textContent = '';
                answerFeedback.className = 'answer-feedback';
            }

            progressCounter.textContent = `Progress: ${currentIndex + 1}/${wordList.length}`;
            errorCounter.textContent = `Error words: ${errorWords.length}`;

            if (errorWords.length > 0) {
                errorWordsSection.classList.remove('hidden');
                errorWordsList.innerHTML = errorWords.map(w => 
                    `<span class="error-word-tag">${w.english}</span>`
                ).join('');
            } else {
                errorWordsSection.classList.add('hidden');
            }
        }

        function handleCardClick() {
            if (currentMode === 'flip-card' || currentMode === 'quiz') {
                const meaningDisplay = document.getElementById('meaningDisplay');
                meaningDisplay.classList.toggle('visible');
            }
        }

        function handleInputEnter(e) {
            if (e.key === 'Enter' && currentMode === 'fill-blank') {
                const inputField = document.getElementById('inputField');
                const answerFeedback = document.getElementById('answerFeedback');
                const word = wordList[currentIndex];
                const userAnswer = inputField.value.trim().toLowerCase();
                const correctAnswer = word.english.toLowerCase();

                if (userAnswer === correctAnswer) {
                    answerFeedback.textContent = 'Correct!';
                    answerFeedback.className = 'answer-feedback correct';
                } else {
                    answerFeedback.textContent = `Incorrect. The answer is: ${word.english}`;
                    answerFeedback.className = 'answer-feedback incorrect';
                }
            }
        }

        function handleKnow() {
            currentIndex++;
            if (currentIndex >= wordList.length) {
                currentIndex = 0;
            }
            saveToLocalStorage();
            updateUI();
        }

        function handleUnknown() {
            const word = wordList[currentIndex];
            if (!errorWords.some(w => w.english === word.english)) {
                errorWords.push(word);
                saveToLocalStorage();
            }
            handleKnow();
        }

        function handleNext() {
            currentIndex++;
            if (currentIndex >= wordList.length) {
                currentIndex = 0;
            }
            saveToLocalStorage();
            updateUI();
        }

        function handleShuffle() {
            wordList = fisherYatesShuffle([...ieltsVocabulary]);
            currentIndex = 0;
            saveToLocalStorage();
            updateUI();
        }

        function handleModeChange(e) {
            if (e.target.classList.contains('mode-btn')) {
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = e.target.dataset.mode;
                updateUI();
            }
        }

        function init() {
            loadFromLocalStorage();
            updateUI();

            document.getElementById('cardContainer').addEventListener('click', handleCardClick);
            document.getElementById('inputField').addEventListener('keydown', handleInputEnter);
            document.getElementById('knowBtn').addEventListener('click', handleKnow);
            document.getElementById('unknownBtn').addEventListener('click', handleUnknown);
            document.getElementById('nextBtn').addEventListener('click', handleNext);
            document.getElementById('shuffleBtn').addEventListener('click', handleShuffle);
            document.querySelector('.mode-selector').addEventListener('click', handleModeChange);
        }

        init();
    </script>
