let index = 0;
let showCn = false;
const boxDom = document.getElementById("wordBox");

function render(){
    const item = wordlist[index];
    if(!item){
        boxDom.innerText = "全部结束";
        return;
    }
    if(showCn){
        boxDom.innerText = item.en + "\n\n" + item.cn;
    }else{
        boxDom.innerText = item.en;
    }
}

function nextWord(){
    index++;
    if(index >= wordlist.length) index = 0;
    render();
}
function prevWord(){
    index--;
    if(index < 0) index = wordlist.length -1;
    render();
}
function toggleCn(){
    showCn = !showCn;
    render();
}

render();
</script>
